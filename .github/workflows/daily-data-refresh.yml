name: WenYing daily private data refresh
on:
  schedule:
    - cron: '30 22,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wenying-daily-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Refresh original private website and verify readback
        env:
          WENYING_SITE_TOKEN: ${{ secrets.WENYING_SITE_TOKEN }}
          WENYING_REFRESH_SECRET: ${{ secrets.WENYING_REFRESH_SECRET }}
        run: node --experimental-strip-types scripts/daily-refresh.mjs
